<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Peter Brumbach{% endblock %}</title>
    <link rel="icon" href="{% block favicon %}{{ url_for('static', filename='images/icons/favicon.ico') }}{% endblock %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">

    <!-- Page CSS -->
    {% block styles %}{% endblock %}
    <!-- Page Javascript -->
    {% block scripts %}{% endblock %}
  </head>
  <body class="d-flex flex-column min-vh-100 bg-black">

    <main class="position-relative z-1">
      {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="position-relative z-1 mt-auto border-top bg-black bg-opacity-75">
      <div class="container py-4">
        <figure class="mb-0">
          <blockquote class="blockquote fs-6 fst-italic">
            <p>{{ verse.text }}</p>
          </blockquote>
          <figcaption class="blockquote-footer mb-0">{{ verse.reference }}</figcaption>
        </figure>
        <hr>
        <div class="d-flex flex-column flex-md-row justify-content-between gap-2 small">
          <span class="text-body-secondary">© {{ year }} Peter Brumbach</span>
          <ul class="list-unstyled d-flex flex-wrap column-gap-4 row-gap-2 mb-0">
            <li><a class="link-light link-offset-2 link-underline-opacity-0 link-underline-opacity-75-hover" href="{{url_for('home.index')}}">Home</a></li>
            <li>&middot;</li>
            <li><a class="link-light link-offset-2 link-underline-opacity-0 link-underline-opacity-75-hover" href="{{url_for('docs.terms_of_service')}}">Terms and Conditions</a></li>
            <li>&middot;</li>
            <li><a class="link-light link-offset-2 link-underline-opacity-0 link-underline-opacity-75-hover" href="{{url_for('docs.sitemap')}}">Sitemap</a></li>
          </ul>
        </div>
      </div>
    </footer>

    <!-- Bootstrap JS (carousels, dropdowns, modals, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
